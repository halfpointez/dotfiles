# ============================================================
# 基础行为设置
# ============================================================
set -g mouse on
set-option -g allow-rename off
set -s escape-time 0
set -g base-index 1
set -g focus-events on
set -g renumber-windows on
set -g repeat-time 0
setw -g aggressive-resize on

# ============================================================
# TPM (Tmux Plugin Manager)
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# 主题插件（精简的 tmux-dotbar）
set -g @plugin 'vaaleyard/tmux-dotbar'

# 可选：调整 tmux-dotbar 外观（位置、颜色等）
# set -g @tmux-dotbar-position top       # 状态栏在顶部（默认底部）
# set -g @tmux-dotbar-right true         # 右侧显示时间
# set -g @tmux-dotbar-bg "#1e1e2e"       # 自定义背景色
# set -g @tmux-dotbar-fg "#cdd6f4"       # 自定义前景色

# ============================================================
# 初始化 TPM（必须放在最后）
# ============================================================
run '~/.tmux/plugins/tpm/tpm'